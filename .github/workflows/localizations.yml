name: Localizations

# Validate the String Catalogs stay in sync with the Swift code that
# consumes them. The script enforces five hard rules:
#
#   - `Localizable.xcstrings` is valid JSON.
#   - Every catalog entry has a translation in all 8 expected locales.
#   - Every key referenced by `Strings.swift` exists in the catalog,
#     and no catalog entry is unreferenced. `Strings.swift` drift would
#     return the literal key as the user-visible string at runtime —
#     a hard regression — and orphan entries are dead translations
#     no one consumes.
#   - Every `detail: "..."` literal in the service-type library exists
#     as a catalog key. Drift here downgrades non-English users to
#     English for that one service.
#   - `InfoPlist.xcstrings` is valid JSON and locale-complete, so iOS
#     never shows an English permission prompt inside an otherwise
#     localized alert. Brand-name entries marked "do not translate"
#     are exempt.
#   - The app target's `Localizable.xcstrings` and
#     `AppShortcuts.xcstrings` are locale-complete, and every Siri
#     phrase keeps its `${applicationName}` token. These back the
#     App Intents surface and must live in the app target, because
#     Xcode disables App Shortcut localization for SPM targets.
#
# Triggers on PRs that touch any input the validator reads — the
# catalogs themselves, `Strings.swift`, the service-type library —
# plus pushes to main as a backstop.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'KozBonPackages/BonjourLocalization/**'
      - 'KozBonPackages/BonjourModels/Sources/ServiceType/MyServiceType+Library.swift'
      - 'KozBon/InfoPlist.xcstrings'
      - 'KozBon/Localizable.xcstrings'
      - 'KozBon/AppShortcuts.xcstrings'
      - 'scripts/validate-localizations.py'
      - '.github/workflows/localizations.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'KozBonPackages/BonjourLocalization/**'
      - 'KozBonPackages/BonjourModels/Sources/ServiceType/MyServiceType+Library.swift'
      - 'KozBon/InfoPlist.xcstrings'
      - 'KozBon/Localizable.xcstrings'
      - 'KozBon/AppShortcuts.xcstrings'
      - 'scripts/validate-localizations.py'
      - '.github/workflows/localizations.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate String Catalogs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python Version
        # ubuntu-latest ships with Python 3 — the script uses only the
        # standard library so no setup-python step is needed.
        run: python3 --version

      - name: Validate
        run: python3 scripts/validate-localizations.py
